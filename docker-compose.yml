# Own compose project on a shared box. No ports are published: the host's
# reverse proxy (Caddy) reaches `web` over the external network named in
# PROXY_NETWORK. The collector writes the SQLite file, web reads it.

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SOLANA_RPC_URL: ${NEXT_PUBLIC_SOLANA_RPC_URL:-https://solana-rpc.publicnode.com}
    image: after-hours:latest
    restart: unless-stopped
    env_file: .env
    # env_file would otherwise override the image's DB path with the local
    # dev value; both containers must point at the shared volume.
    environment:
      AFTER_HOURS_DB: /data/after-hours.db
    volumes:
      - ah_data:/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/radar').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3

  collector:
    image: after-hours:latest
    restart: unless-stopped
    env_file: .env
    environment:
      AFTER_HOURS_DB: /data/after-hours.db
    command: ["node", "scripts/collector.ts"]
    volumes:
      - ah_data:/data
    networks:
      - proxy

volumes:
  ah_data:

networks:
  proxy:
    name: ${PROXY_NETWORK:-marty-media_default}
    external: true
